# ──────────────────────────────────────────────────────────────
# Railway Block Planner — Local Development Stack
# ──────────────────────────────────────────────────────────────
# Usage:
#   docker compose up --build        Start all services
#   docker compose down              Stop all services
#   docker compose down -v           Stop + delete database data
#   docker compose exec app bash     Shell into the app container
# ──────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railway_secret}
      POSTGRES_DB: ${POSTGRES_DB:-railway_block_planner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railway}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (message broker for Celery) ────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Application ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount source code for hot-reload during development
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
