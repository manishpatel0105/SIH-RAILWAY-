# Alembic Configuration
# See: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to the migration scripts directory
script_location = alembic

# The database URL is loaded programmatically in alembic/env.py
# from our app.config module — NOT hardcoded here.
# sqlalchemy.url is left empty intentionally.
sqlalchemy.url =

# Logging configuration for Alembic
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
